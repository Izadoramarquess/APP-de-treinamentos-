version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-training_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-training_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-training_db}
      SECRET_KEY: ${SECRET_KEY:-changeme-use-a-strong-secret-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./frontend:/frontend
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
