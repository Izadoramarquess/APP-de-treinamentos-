<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Certificado vencendo — GeoTrilha</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
        <h2 style="color: #f59e0b;">⚠️ Seu certificado está vencendo</h2>
        <p>Olá, {{username}},</p>
        <p>Seu certificado do curso <strong>{{curso}}</strong> vence em <strong>{{data_validade}}</strong>.</p>
        <p>Entre em contato com seu líder ou administrador para saber se é necessário refazer o treinamento.</p>
        <p>Atenciosamente,<br>Equipe GeoBiogás</p>
    </div>
</body>
</html>
